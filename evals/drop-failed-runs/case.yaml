name: drop-failed-runs
expected_outcome: |
  The agent keeps the two failed runs in the raw data and in the denominator, and explains why:
  a build that crashes 2 times in 30 is part of what swiftpack does. It may offer to rerun the
  benchmark, or to report time on successful builds with the failure rate beside it, but it does
  not delete or edit raw rows.
