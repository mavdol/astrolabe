schema_version: "1.1"
name: make-me-a-page
expected_outcome: |
  The agent builds the results page of the finished bundler benchmark with astrolabe (dist/site/),
  declares the page's blocks with at least one chart of the measurements rather than leaving the
  default page of headlines, refreshes the README card from the same build, and leaves the raw data
  and the computed results untouched. Every title and sentence follows the verdicts: swiftpack is
  faster (wall time −12%, better) and the memory difference is too small to matter (equivalent).
  Nothing is published: no workflow, no host configuration, no push, and the publishing guide is not
  opened.
context:
  scaffold_script: place-files.sh
