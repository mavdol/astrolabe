name: Release

# Releases the version on main: bump it first in a pull request with pnpm set-version <version>.
on:
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Released from main, under a new version
        run: |
          VERSION=$(node -p 'require("./package.json").version')
          TAG="v$VERSION"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          if [ "$GITHUB_REF" != refs/heads/main ]; then
            echo "::error::run this workflow on main, not $GITHUB_REF"
            exit 1
          fi
          if git rev-parse --quiet --verify "refs/tags/$TAG" >/dev/null; then
            echo "::error::$TAG already exists: bump the version in a pull request first, with pnpm set-version <version>"
            exit 1
          fi
          echo "PREVIOUS_TAG=$(git tag --list 'v*' --sort=-v:refname | head -n 1)" >> "$GITHUB_ENV"

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: npm with trusted publishing
        run: npm install --global npm@11

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Format
        run: pnpm format:check

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: The package holds the command and the skill
        run: |
          npm pack --dry-run --json > pack.json
          for file in dist/cli/index.js plugin/skills/astrolabe-benchmark/SKILL.md; do
            node -e 'const [pack] = require("./pack.json"); process.exit(pack.files.some((entry) => entry.path === process.argv[1]) ? 0 : 1)' "$file" \
              || { echo "::error::$file is missing from the package"; exit 1; }
          done
          rm pack.json

      - name: Tag the release
        run: git tag "$TAG"

      - name: Publish to npm
        run: |
          case "$VERSION" in
            *-*) npm publish --access public --tag next ;;
            *) npm publish --access public ;;
          esac
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Push the tag
        run: git push origin "refs/tags/$TAG"

      - name: Draft the GitHub release
        run: gh release create "$TAG" --draft --verify-tag --title "$TAG" --generate-notes ${PREVIOUS_TAG:+--notes-start-tag "$PREVIOUS_TAG"}
        env:
          GH_TOKEN: ${{ github.token }}
